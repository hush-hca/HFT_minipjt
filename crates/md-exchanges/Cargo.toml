[package]
name = "md-exchanges"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
futures-util = { version = "0.3.34", features = ["sink"] }
funding-core = { version = "0.1.0", path = "../funding-core" }
md-core = { version = "0.1.0", path = "../md-core" }
rand = "0.10.2"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
ryu = "1.0.23"
serde = { version = "1.0.228", features = ["derive"] }
simd-json = "0.15.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.17", features = ["rt"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.24.1", features = ["v7"] }
